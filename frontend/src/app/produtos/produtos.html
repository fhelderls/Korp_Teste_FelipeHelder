<section class="card">
  <h2>Produtos</h2>

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }

  <form class="form-inline" (ngSubmit)="criar()">
    <input [(ngModel)]="novoProduto.codigo" name="codigo" placeholder="Código" required>
    <input [(ngModel)]="novoProduto.descricao" name="descricao" placeholder="Descrição" required>
    <input [(ngModel)]="novoProduto.saldo" name="saldo" type="number" placeholder="Saldo" required>
    <input [(ngModel)]="precoTexto" name="preco" type="text" inputmode="decimal" placeholder="Preço (ex: 25,50)" required>
    <button type="submit">Criar produto</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Saldo</th>
        <th>Preço</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (produto of produtos(); track produto.codigo) {
        <tr>
          <td>{{ produto.codigo }}</td>
          <td>{{ produto.descricao }}</td>
          <td>{{ produto.saldo }}</td>
          <td>{{ produto.preco | currency:'BRL' }}</td>
          <td>
            <button type="button" class="btn-excluir" (click)="deletar(produto.codigo)">Excluir</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="vazio">Nenhum produto cadastrado ainda.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
