services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp
      POSTGRES_DB: estoque
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korp"]
      interval: 5s
      timeout: 5s
      retries: 5

  estoque-service:
    build: ./estoque-service
    environment:
      DATABASE_URL: postgres://korp:korp@postgres:5432/estoque?sslmode=disable
      PORT: "8081"
    ports:
      - "8083:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  faturamento-service:
    build: ./faturamento-service
    environment:
      DATABASE_URL: postgres://korp:korp@postgres:5432/faturamento?sslmode=disable
      ESTOQUE_SERVICE_URL: http://estoque-service:8081
      PORT: "8082"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      estoque-service:
        condition: service_started
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - estoque-service
      - faturamento-service

volumes:
  postgres_data:
